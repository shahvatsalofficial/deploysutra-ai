name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Unit, integration, security, MCP and skills tests
        run: npm test
      - name: Host doctor
        run: npm run doctor
      - name: Offline demo (regenerates every sample report)
        run: npm run demo
      - name: Independent audit report (JSON + MD + HTML)
        run: node packages/cli/index.mjs audit --out audit-out
      - name: Upload audit report
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-report
          path: audit-out
          retention-days: 14
  package:
    name: npm pack and clean install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Pack
        run: npm pack --silent
      - name: Install the tarball in an empty project and run the CLI through the npm bin shim
        run: |
          mkdir smoke && cd smoke && npm init -y >/dev/null
          npm install ../deploysutra-ai-*.tgz
          npx deploysutra --version
          npx deploysutra doctor >/dev/null
          npx deploysutra audit --skip-tests --out out --quiet
          test -f out/audit-report.html && test -f out/audit-report.md && test -f out/audit-report.json
          npx deploysutra analyze --before node_modules/deploysutra-ai/fixtures/k8s/before.yaml --after node_modules/deploysutra-ai/fixtures/k8s/after.yaml --out rep || test $? -eq 2
          test -f rep/deploy-readiness.html
          npx deploysutra verify --report rep/deploy-readiness.json
          npx deploysutra install-skills --host claude --target . >/dev/null
          test -f .claude/skills/deploysutra-prime/SKILL.md
  secrets-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for committed tokens
        run: |
          if git grep -nE '(ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|npm_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!tests' ':!packages/core/audit.mjs'; then echo "Possible secret committed"; exit 1; fi
