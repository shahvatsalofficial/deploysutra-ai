apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: demo
spec:
  replicas: 0
  strategy:
    type: Recreate
  template:
    spec:
      serviceAccountName: checkout-admin
      hostNetwork: true
      containers:
        - name: checkout
          image: example/checkout:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
