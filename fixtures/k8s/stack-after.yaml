# Synthetic multi-document stack after a risky change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      serviceAccountName: shop
      containers:
        - name: shop
          image: registry.example.com/shop:latest
          env:
            - name: LOG_LEVEL
              value: debug
            - name: DB_PASSWORD
              value: 'FAKE-DEMO-VALUE-not-a-real-secret'
          envFrom:
            - configMapRef:
                name: shop-config
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: demo
spec:
  type: LoadBalancer
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: demo
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: demo
data:
  FEATURE_X: 'on'
